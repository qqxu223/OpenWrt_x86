name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qqxu223-upstream-diff
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/mgz0227/OpenWrt_x86.git
          git fetch upstream master
          git rebase upstream/master
          git push --force-with-lease origin qqxu223-upstream-diff
